services:
  seatime:
    build: .
    container_name: seatime
    hostname: seatime
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "123:123/udp"
      - "8123:8123/tcp"
    cap_add:
      - SYS_TIME
    # USB GPS puck (optional): pass the device through and set
    # USB_GPS_DEVICE=/dev/gps0 in .env. Use the stable /dev/serial/by-id/
    # path on the host side — ttyACM0/ttyUSB0 numbering can change on replug.
    # devices:
    #   - /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_7_-_GPS_GNSS_Receiver-if00:/dev/gps0
    volumes:
      - ./data:/data
      # Bind-mount the host timezone so the web UI reflects actual host time.
      # If these files don't exist on your host (rare, but possible on non-
      # standard Linux setups), the bridge falls back to UTC.
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "chronyc tracking >/dev/null && wget -qO- http://localhost:8123/api/status >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
